
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Snake Arena - 2D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d19;color:white;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 padding:15px;
}
.game{width:min(100%,950px)}
header{text-align:center;margin-bottom:15px}
h1{margin:0;color:#32f5c8;font-size:clamp(27px,5vw,42px);
 text-shadow:0 0 20px #00ffc3}
header p{color:#8999b5;margin:8px}
.dashboard{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:10px;margin-bottom:12px
}
.stat{
 background:#121d30;border:1px solid #263c58;
 border-radius:12px;padding:12px;text-align:center
}
.stat small{color:#91a4c2;display:block;margin-bottom:5px}
.stat strong{font-size:22px;color:#36f5ce}
.arena{
 position:relative;background:#071321;
 border:2px solid #1b4560;border-radius:15px;
 overflow:hidden;box-shadow:0 0 30px #00e5ff22
}
canvas{display:block;width:100%;height:auto}
.overlay{
 position:absolute;inset:0;background:#071321dd;
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:20px;
}
.panel{width:min(100%,440px)}
.panel h2{font-size:30px;color:#36f5ce;margin:5px}
.panel p{color:#a5b6cf;line-height:1.5}
select,button{
 background:#14243a;color:white;border:1px solid #35506c;
 padding:12px;border-radius:9px;font-size:14px;
 cursor:pointer
}
select{width:100%;margin:5px 0 12px}
button:hover{background:#1c4051;border-color:#35f5c8}
.primary{background:#00b991;color:#001b19;font-weight:bold;border:0}
.primary:hover{background:#36f5ce}
.controls{
 display:flex;flex-wrap:wrap;gap:9px;
 justify-content:center;margin:12px 0
}
.controls button{flex:1;min-width:95px}
.info{
 display:flex;justify-content:space-between;
 flex-wrap:wrap;gap:10px;color:#91a4c2;font-size:13px
}
#message{color:#36f5ce;min-height:20px;text-align:center;margin:8px}
.mobile{
 display:grid;grid-template-columns:repeat(3,55px);
 gap:7px;justify-content:center;margin:15px auto
}
.mobile button{height:48px;font-size:21px}
.mobile .empty{visibility:hidden}
@media(min-width:700px){.mobile{display:none}}
@media(max-width:500px){
 .dashboard{grid-template-columns:repeat(2,1fr)}
 .stat{padding:9px}
}
</style>
</head>
<body>
<div class="game">
<header>
 <h1>🐍 SNAKE ARENA</h1>
 <p>Ultimate 2D Neon Snake Challenge</p>
</header>

<div class="dashboard">
 <div class="stat"><small>SCORE</small><strong id="score">0</strong></div>
 <div class="stat"><small>HIGH SCORE</small><strong id="high">0</strong></div>
 <div class="stat"><small>LENGTH</small><strong id="length">3</strong></div>
 <div class="stat"><small>LEVEL</small><strong id="level">1</strong></div>
</div>

<div class="arena">
 <canvas id="canvas" width="800" height="500"></canvas>

 <div class="overlay" id="menu">
  <div class="panel">
   <h2>🐍 SNAKE ARENA</h2>
   <p>Eat food, grow bigger, defeat enemy snakes and survive!</p>
   <label>GAME MODE</label>
   <select id="mode">
    <option value="classic">Classic Mode</option>
    <option value="endless">Endless Mode</option>
    <option value="survival">Survival Mode</option>
    <option value="time">Time Challenge (60 sec)</option>
    <option value="battle">AI Battle Mode</option>
   </select>
   <label>DIFFICULTY</label>
   <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium" selected>Medium</option>
    <option value="hard">Hard</option>
    <option value="extreme">Extreme</option>
   </select>
   <button class="primary" style="width:100%;margin-top:10px" onclick="startGame()">START GAME ▶</button>
  </div>
 </div>

 <div class="overlay" id="gameover" style="display:none">
  <div class="panel">
   <h2 id="resultTitle">GAME OVER!</h2>
   <p id="resultText">Your score: 0</p>
   <button class="primary" onclick="startGame()">PLAY AGAIN ↻</button>
   <button onclick="showMenu()">MAIN MENU</button>
  </div>
 </div>
</div>

<div class="controls">
 <button onclick="togglePause()" id="pauseBtn">⏸ PAUSE</button>
 <button onclick="boost()">⚡ BOOST</button>
 <button onclick="toggleSound()" id="soundBtn">🔊 SOUND</button>
 <button onclick="showMenu()">⌂ MENU</button>
</div>

<div class="mobile">
 <span class="empty"></span>
 <button onclick="turn('up')">▲</button>
 <span class="empty"></span>
 <button onclick="turn('left')">◀</button>
 <button onclick="turn('down')">▼</button>
 <button onclick="turn('right')">▶</button>
</div>

<div id="message">Use arrow keys or WASD to control your snake.</div>
<div class="info">
 <span>🟢 Green: Food +10</span>
 <span>🟡 Gold: Bonus +30</span>
 <span>⚡ Power-ups: Special abilities</span>
</div>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const W=800,H=500,C=20;
const cols=W/C,rows=H/C;

let snake,foods=[],enemies=[],powerups=[];
let dir={x:1,y:0},nextDir={x:1,y:0};
let score=0,level=1,tick=0;
let running=false,paused=false,ended=false;
let mode="classic",difficulty="medium";
let sound=true,boosting=false,shield=0,magnet=0,doubleScore=0;
let seconds=60,lastTime=0,foodTimer=0,powerTimer=0;
let high=Number(localStorage.getItem("snakeHigh")||0);
let loop;

document.getElementById("high").textContent=high;

const speeds={easy:155,medium:115,hard:85,extreme:60};

function randomCell(){
 return {x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};
}
function same(a,b){return a.x===b.x&&a.y===b.y}
function occupied(p){
 return snake.some(s=>same(s,p))||
 enemies.some(e=>e.body.some(s=>same(s,p)));
}
function foodPosition(){
 let p;
 do{p=randomCell()}while(occupied(p));
 return p;
}
function makeFood(){
 foods.push({...foodPosition(),type:Math.random()<.13?"gold":"normal"});
}
function makePower(){
 powerups.push({...foodPosition(),type:["speed","shield","magnet","double"][Math.floor(Math.random()*4)]});
}
function updateHUD(){
 document.getElementById("score").textContent=score;
 document.getElementById("length").textContent=snake.length;
 document.getElementById("level").textContent=level;
 document.getElementById("high").textContent=high;
}
function startGame(){
 mode=document.getElementById("mode").value;
 difficulty=document.getElementById("difficulty").value;
 snake=[{x:10,y:12},{x:9,y:12},{x:8,y:12}];
 dir={x:1,y:0};nextDir={x:1,y:0};
 score=0;level=1;seconds=60;
 foods=[];enemies=[];powerups=[];
 shield=0;magnet=0;doubleScore=0;boosting=false;
 paused=false;ended=false;running=true;
 for(let i=0;i<5;i++)makeFood();
 if(mode==="battle"||mode==="survival"){
  for(let i=0;i<(mode==="battle"?3:2);i++){
   let p=randomCell();
   enemies.push({body:[p,{x:p.x-1,y:p.y},{x:p.x-2,y:p.y}],dir:{x:1,y:0},color:["#ff4e7c","#a879ff","#ffad42"][i]});
  }
 }
 document.getElementById("menu").style.display="none";
 document.getElementById("gameover").style.display="none";
 document.getElementById("message").textContent="Game started! Good luck!";
 updateHUD();
 lastTime=performance.now();
 clearInterval(loop);
 loop=setInterval(update, speeds[difficulty]);
 draw();
}
function showMenu(){
 running=false;paused=false;clearInterval(loop);
 document.getElementById("menu").style.display="flex";
 document.getElementById("gameover").style.display="none";
}
function gameOver(message){
 if(ended)return;
 ended=true;running=false;clearInterval(loop);
 if(score>high){
  high=score;
  localStorage.setItem("snakeHigh",high);
 }
 updateHUD();
 document.getElementById("resultTitle").textContent=message;
 document.getElementById("resultText").textContent="Your score: "+score+" | Length: "+snake.length;
 document.getElementById("gameover").style.display="flex";
}
function togglePause(){
 if(!running||ended)return;
 paused=!paused;
 document.getElementById("pauseBtn").textContent=paused?"▶ RESUME":"⏸ PAUSE";
 document.getElementById("message").textContent=paused?"Game paused":"Game resumed";
}
function turn(d){
 const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
 let n=dirs[d];
 if(n.x===-dir.x&&n.y===-dir.y)return;
 nextDir=n;
}
document.addEventListener("keydown",e=>{
 const keys={ArrowUp:"up",w:"up",ArrowDown:"down",s:"down",
 ArrowLeft:"left",a:"left",ArrowRight:"right",d:"right"};
 if(keys[e.key]){
  e.preventDefault();turn(keys[e.key]);
 }
 if(e.code==="Space"){e.preventDefault();togglePause()}
 if(e.key==="Shift")boost();
});

let boostReady=true;
function boost(){
 if(!running||paused||!boostReady)return;
 boosting=true;boostReady=false;
 document.getElementById("message").textContent="⚡ SPEED BOOST!";
 setTimeout(()=>boosting=false,1800);
 setTimeout(()=>boostReady=true,5000);
}
function toggleSound(){
 sound=!sound;
 document.getElementById("soundBtn").textContent=sound?"🔊 SOUND":"🔇 MUTED";
}
function beep(freq=500){
 if(!sound)return;
 try{
  let ac=new(window.AudioContext||window.webkitAudioContext)();
  let o=ac.createOscillator(),g=ac.createGain();
  o.frequency.value=freq;g.gain.value=.04;
  o.connect(g);g.connect(ac.destination);
  o.start();o.stop(ac.currentTime+.09);
 }catch(e){}
}
function addScore(points){
 score+=points*(doubleScore>0?2:1);
 level=Math.floor(score/100)+1;
 if(score>high)high=score;
 updateHUD();
}
function update(){
 if(!running||paused||ended)return;

 tick++;
 dir=nextDir;
 let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

 // Wall collisions
 if(mode!=="endless"&&mode!=="survival"){
  if(head.x<0||head.x>=cols||head.y<0||head.y>=rows){
   return gameOver("WALL COLLISION!");
  }
 }else{
  head.x=(head.x+cols)%cols;
  head.y=(head.y+rows)%rows;
 }

 let eating=foods.find(f=>same(f,head));
 let bodyCheck=eating?snake:snake.slice(0,-1);

 if(bodyCheck.some(s=>same(s,head))){
  if(shield>0)shield=0;
  else return gameOver("YOU CRASHED!");
 }
 for(let enemy of enemies){
  if(enemy.body.some(s=>same(s,head))){
   if(shield>0)shield=0;
   else return gameOver("ENEMY COLLISION!");
  }
 }

 snake.unshift(head);
 if(eating){
  addScore(eating.type==="gold"?30:10);
  beep(650);
  foods=foods.filter(f=>f!==eating);
  makeFood();
 }else snake.pop();

 // Power-ups
 let p=powerups.find(p=>same(p,head));
 if(p){
  if(p.type==="speed")boosting=true;
  if(p.type==="shield")shield=1;
  if(p.type==="magnet")magnet=100;
  if(p.type==="double")doubleScore=100;
  document.getElementById("message").textContent="POWER UP: "+p.type.toUpperCase();
  powerups=powerups.filter(x=>x!==p);
  beep(900);
 }

 // Magnet attracts food
 if(magnet>0){
  magnet--;
  for(let f of foods){
   if(Math.abs(f.x-head.x)+Math.abs(f.y-head.y)<6){
    f.x+=Math.sign(head.x-f.x);
    f.y+=Math.sign(head.y-f.y);
   }
  }
 }
 if(doubleScore>0)doubleScore--;

 // Enemy AI
 enemies.forEach(enemy=>{
  let target=snake[0];
  let options=[
   {x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}
  ].filter(d=>!(d.x===-enemy.dir.x&&d.y===-enemy.dir.y));
  options.sort((a,b)=>{
   let da=Math.abs(enemy.body[0].x+a.x-target.x)+Math.abs(enemy.body[0].y+a.y-target.y);
   let db=Math.abs(enemy.body[0].x+b.x-target.x)+Math.abs(enemy.body[0].y+b.y-target.y);
   return da-db;
  });
  if(Math.random()<.2)options.sort(()=>Math.random()-.5);
  let chosen=options.find(d=>{
   let x=enemy.body[0].x+d.x,y=enemy.body[0].y+d.y;
   return x>=0&&x<cols&&y>=0&&y<rows&&
    !enemy.body.slice(0,-1).some(s=>s.x===x&&s.y===y)&&
    !snake.some(s=>s.x===x&&s.y===y);
  });
  if(chosen){
   enemy.dir=chosen;
   enemy.body.unshift({x:enemy.body[0].x+chosen.x,y:enemy.body[0].y+chosen.y});
   if(enemy.body.length>5)enemy.body.pop();
  }
 });

 // Timed challenges
 if(mode==="time"){
  if(tick%10===0)seconds-=.1;
  if(seconds<=0)return gameOver("TIME'S UP!");
 }
 if(mode==="survival"&&tick%100===0)makeFood();

 foodTimer++;
 if(foodTimer>100&&foods.length<7){makeFood();foodTimer=0}
 powerTimer++;
 if(powerTimer>100){
  if(powerups.length<2)makePower();
  powerTimer=0;
 }
 if(boosting)boosting=false;
 updateHUD();
 draw();
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.fillStyle="#071321";
 ctx.fillRect(0,0,W,H);

 // Arena grid
 ctx.strokeStyle="#142b40";
 ctx.lineWidth=1;
 for(let x=0;x<=W;x+=C){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=0;y<=H;y+=C){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }

 // Food
 foods.forEach(f=>{
  ctx.save();
  ctx.shadowBlur=18;
  ctx.shadowColor=f.type==="gold"?"#ffd54a":"#31f5a5";
  ctx.fillStyle=f.type==="gold"?"#ffd54a":"#31f5a5";
  ctx.beginPath();
  ctx.arc(f.x*C+C/2,f.y*C+C/2, f.type==="gold"?8:6,0,Math.PI*2);
  ctx.fill();ctx.restore();
 });

 // Power-ups
 powerups.forEach(p=>{
  const colors={speed:"#ff4f8b",shield:"#4ea9ff",magnet:"#c77dff",double:"#ffd54a"};
  ctx.save();ctx.fillStyle=colors[p.type];ctx.shadowBlur=15;ctx.shadowColor=colors[p.type];
  ctx.fillRect(p.x*C+3,p.y*C+3,14,14);
  ctx.fillStyle="white";ctx.font="bold 12px Arial";ctx.textAlign="center";
  ctx.fillText({speed:"⚡",shield:"S",magnet:"M",double:"2"}[p.type],p.x*C+10,p.y*C+15);
  ctx.restore();
 });

 // Enemies
 enemies.forEach(e=>drawSnake(e.body,e.color,false));

 // Player
 drawSnake(snake,shield>0?"#ffffff":"#26e8ba",true);

 if(mode==="time"){
  ctx.fillStyle="white";ctx.font="bold 17px Arial";
  ctx.fillText("TIME: "+Math.ceil(seconds),15,25);
 }
}
function drawSnake(body,color,player){
 body.forEach((s,i)=>{
  let x=s.x*C,y=s.y*C;
  let head=i===0;
  ctx.save();
  ctx.shadowBlur=player?12:8;
  ctx.shadowColor=color;
  ctx.fillStyle=head?"#a3ffed":color;
  let pad=head?2:3;
  ctx.beginPath();
  ctx.roundRect(x+pad,y+pad,C-pad*2,C-pad*2,head?7:6);
  ctx.fill();
  if(head&&player){
   // Eyes
   ctx.shadowBlur=0;ctx.fillStyle="#071321";
   let ex=dir.x===1?14:dir.x===-1?5:dir.x===0?6:6;
   let ey=dir.y===1?14:dir.y===-1?5:dir.y===0?6:6;
   ctx.beginPath();ctx.arc(x+ex,y+ey,2.2,0,7);ctx.fill();
   ctx.beginPath();ctx.arc(x+(dir.x===0?14:ex),y+(dir.y===0?14:ey),2.2,0,7);ctx.fill();
  }
  ctx.restore();
 });
}

// Swipe controls
let touchX=0,touchY=0;
canvas.addEventListener("touchstart",e=>{
 touchX=e.touches[0].clientX;touchY=e.touches[0].clientY;
},{passive:true});
canvas.addEventListener("touchend",e=>{
 let dx=e.changedTouches[0].clientX-touchX;
 let dy=e.changedTouches[0].clientY-touchY;
 if(Math.abs(dx)>Math.abs(dy))turn(dx>0?"right":"left");
 else turn(dy>0?"down":"up");
},{passive:true});

draw();
</script>
</body>
</html>
